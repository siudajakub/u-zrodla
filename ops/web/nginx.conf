# Serwis web: statyczny pulpit (web/) + reverse proxy do api (REST, WebSocket, dowody).
# Proces bez roota na systemie plików tylko do odczytu: pid i bufory w /tmp (tmpfs), port 8080 w kontenerze.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # DNS Dockera: po restarcie api nowy adres jest widoczny bez restartu web.
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 8080;
    root /srv/web;
    index index.html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Wszystko, co obsługuje aplikacja: REST i WebSocket (/v1), pliki dowodów i przesłane nagrania.
    location ~ ^/(v1|uploads|evidence|media)(/|$) {
      set $api http://api:8769;
      proxy_pass $api;
      proxy_http_version 1.1;
      # Host bez zmian (z portem): api sprawdza TrustedHost i zgodność Origin z Host.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 120s;
      # Upload nagrania: limit aplikacji 40 MiB, strumieniowo bez buforowania na dysku.
      client_max_body_size 48m;
      proxy_request_buffering off;
    }

    # Pliki robocze frontu nie są częścią pulpitu.
    location ~ (^/node_modules/|^/src/|^/sample/|\.md$|\.mjs$|^/package(-lock)?\.json$|/\.) { return 404; }

    location / {
      try_files $uri $uri/ =404;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }
  }
}
