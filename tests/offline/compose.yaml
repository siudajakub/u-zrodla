# Overlay for the isolated offline verification project. Objects: INVESTWATCH_OBJECTS_DIR (set by verify.py).
# The backend network of compose.yaml is already internal; only the web proxy publishes a loopback port.
x-proof: &proof
  restart: "no"
  cpus: 1
  volumes:
    - ${INVESTWATCH_PROOF_STATE:?}:/data
    - ${INVESTWATCH_PROOF_WATCH:?}:/app/.runtime/watch:ro
  environment:
    INVESTWATCH_DISCOVERY_INTERVAL: "0"
services:
  web:
    restart: "no"
  api:
    <<: *proof
  worker:
    <<: *proof
